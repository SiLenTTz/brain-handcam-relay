<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Brain einsammeln</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#04120f; color:#dff3ee; font:16px/1.5 -apple-system,system-ui,sans-serif;
         min-height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; display:flex; justify-content:space-between; align-items:center;
           border-bottom:1px solid #14484f; }
  header b { letter-spacing:.16em; font-size:13px; color:#8ff0e4; }
  header a { color:#8ff0e4; text-decoration:none; font-size:13px; border:1px solid #1d6a5c;
             padding:5px 12px; border-radius:10px; }
  main { flex:1; padding:14px 16px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
  label { font-size:12px; color:#8ff0e4; letter-spacing:.08em; }
  input, textarea { width:100%; background:#0a2a24; color:#dff3ee; border:1px solid #1d6a5c;
    border-radius:12px; padding:12px; font-size:16px; }
  textarea { min-height:38dvh; resize:vertical; font:inherit; }
  .cats { display:flex; flex-wrap:wrap; gap:8px; }
  .cats button { flex:1 1 30%; appearance:none; border:1px solid #1d6a5c; background:#0a2a24;
    color:#c5f5ea; border-radius:12px; padding:12px 8px; font-size:15px; }
  .cats button.on { background:#1d6a5c; color:#fff; }
  footer { padding:12px 16px calc(16px + env(safe-area-inset-bottom)); }
  #send { width:100%; appearance:none; border:none; background:#1d6a5c; color:#eafffa;
    border-radius:14px; padding:16px; font-size:17px; font-weight:600; }
  #send:disabled { opacity:.45; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:96px;
    background:#0d3a24; color:#7dffb8; padding:10px 20px; border-radius:12px;
    font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
  .hint { font-size:12px; color:#7bb8ac; }
</style>
</head>
<body>
<header><b>🧠 EINSAMMELN</b><a href="/handcam">zur Kamera</a></header>
<main>
  <div class="hint">Was dir einfällt — landet automatisch als Notiz in deiner Brain-Inbox
    (00_inbox) und erscheint gleich in der Galaxy.</div>
  <div>
    <label for="title">Titel (optional)</label>
    <input id="title" placeholder="Worum geht's?" autocomplete="off">
  </div>
  <div>
    <label>Art</label>
    <div class="cats" id="cats">
      <button data-c="idee" class="on">💡 Idee</button>
      <button data-c="projekt">📌 Projekt</button>
      <button data-c="thema">📚 Thema</button>
      <button data-c="system">🔧 System</button>
      <button data-c="offen">❓ Offen</button>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column">
    <label for="text">Notiz</label>
    <textarea id="text" placeholder="Einfach losschreiben …"></textarea>
  </div>
</main>
<footer>
  <button id="send">Ins Brain einsammeln 🚀</button>
  <div id="toast"></div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
// Token aus ?token= in sessionStorage übernehmen — POST /capture braucht ihn
try {
  const t = new URLSearchParams(location.search).get("token");
  if (t) sessionStorage.setItem("handcam_token", t);
} catch (e) {}
const token = (() => { try { return sessionStorage.getItem("handcam_token") || ""; } catch (e) { return ""; } })();
let cat = "idee";
$("cats").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  cat = b.dataset.c;
  for (const x of $("cats").children) x.classList.toggle("on", x === b);
});
function toast(msg, ok = true) {
  const t = $("toast");
  t.textContent = msg;
  t.style.background = ok ? "#0d3a24" : "#3a1d24";
  t.style.color = ok ? "#7dffb8" : "#ff9d9d";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}
$("send").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) { toast("Erst etwas notieren 🙂", false); return; }
  $("send").disabled = true;
  try {
    const r = await fetch("/capture", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(token ? { "x-handcam-token": token } : {}) },
      body: JSON.stringify({ title: $("title").value.trim(), text, category: cat }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "speichern fehlgeschlagen");
    toast("Gespeichert ✓ erscheint gleich im Brain");
    $("text").value = ""; $("title").value = "";
  } catch (e) {
    toast("Fehler: " + e.message, false);
  } finally {
    $("send").disabled = false;
  }
};
</script>
</body>
</html>
